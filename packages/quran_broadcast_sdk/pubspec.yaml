name: quran_broadcast_sdk
description: Offline Quran broadcast recognition, verse matching, translation, and history for Flutter.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.5
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  record: ^6.2.1
  sqflite: ^2.4.2+1
  path_provider: ^2.1.6
  google_mlkit_translation: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.llvision.quran_broadcast_sdk
        pluginClass: QuranBroadcastSdkPlugin
      ios:
        pluginClass: QuranBroadcastSdkPlugin
  assets:
    - assets/quran_offline/vocab.json
    - assets/broadcast_quran/full/
    - assets/broadcast_quran/full/translations/
